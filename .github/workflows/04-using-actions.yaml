name: 04 - Using Actions

on:
    # push:
    workflow_dispatch:

jobs:
    build:
        defaults:
            run:
                working-directory: 04-using-actions/react-app
        runs-on: ubuntu-latest
        steps:
            #* 0. Checkout the code for repository and setup nodejs environment
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Print Folders
              run: ls -la

            - name: Setup NodeJS
              uses: actions/setup-node@v6
              with:
                  node-version: '24.15.0'

            #* 1. Install deps for out react application
            - name: Install dependencies
              run: npm ci

            #* 2. Run tests for our react application
            - name: Run Unit tests
              run: npm run lint
