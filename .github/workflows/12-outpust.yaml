name: 12 - Working with Outputs

on:
    workflow_dispatch:
        inputs:
            build-status:
                type: choice
                options:
                    - success
                    - failure
                default: success
                description: 'Simulate a build status'
jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            build-status: ${{ steps.build.outputs.status }}
        steps:
            - name: Print GITHUB_OUTPUT Path
              run: echo "$GITHUB_OUTPUT"
            - name: build
              id: build
              run: |
                  echo "$GITHUB_OUTPUT"
                  echo "status=${{ inputs.build-status }}" >> $GITHUB_OUTPUT
    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: ${{ needs.build.outputs.build-status == 'success' }}
        steps:
            - name: Deploy
              run: echo "Build succeeded, deploying application..."
