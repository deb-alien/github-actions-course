name: 11 - Using Inputs

on:
    workflow_dispatch:
        inputs:
            dry-run:
                type: boolean
                default: false
                description: 'Skip deployment and only print build output'
            target:
                type: environment
                description: 'Which environment the workflow will target'
            tag:
                type: choice
                options:
                    - v1
                    - v2
                    - v3
                default: v3
                description: 'Which tag to build from'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Build
              run: |
                  echo "Building from tag ${{ inputs.tag }}"
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.target }}
        if: ${{ !inputs.dry-run }}
        needs:
            - build
        steps:
            - name: Deploy
              run: |
                  echo "Deploying to ${{ inputs.target }} environment"
