name: 15 - Working with Matrices

on:
    workflow_dispatch:

jobs:
    backwards-compatibility:
        name: ${{ matrix.os }}-${{ matrix.node-version }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                node-version: [18.x, 20.x, 24.x]
                os:
                    - ubuntu-latest
                    - windows-latest
                include:
                    - node-version: 16.x
                      os: ubuntu-latest
                    - node-version: 21.x
                      os: ubuntu-latest
                      tag: experimental
        steps:
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Fail if experimental
              if: matrix.tag == 'experimental'
              run: exit 1
            - name: Perform Tests
              run: |
                  echo "Running tests on OS: ${{ matrix.os }} with Node.js version: ${{ matrix.node-version }}"
                  sleep 10
            - name: Upload Test Results
              run: echo "Uploading test results."
    include-example:
        runs-on: ubuntu-latest
        name: ${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}
        strategy:
            matrix:
                color: [red, green]
                shape: [circle, square]
                size: [small, large]
                include:
                    - color: red
                      opacity: 75
                    - shape: circle
                      opacity: 100
                    - color: red
                      shape: triangle
                    - opacity: 50
        steps:
            - name: Dummy Step
              run: |
                  echo "${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}"
