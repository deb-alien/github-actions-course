name: 16 - Working with Environments

on:
    workflow_dispatch:

jobs:
    deploy-staging:
        runs-on: ubuntu-latest
        environment: staging
        env:
            MY_ENV_VALUE: ${{ vars.MY_ENV_VALUE || 'default_value' }}
        steps:
            - name: Echo Vars
              run: echo "Deploying to staging"
    e2e-tests:
        runs-on: ubuntu-latest
        needs:
            - deploy-staging
        if: ${{ needs.deploy-staging.result == 'success'}}
        steps:
            - name: Run E2E Tests
              run: echo "Running E2E tests against staging environment"

    deploy-prod:
        runs-on: ubuntu-latest
        needs:
            - e2e-tests
        if: ${{ needs.e2e-tests.result == 'success'}}
        environment: prod
        env:
            MY_ENV_VALUE: ${{ vars.MY_ENV_VALUE || 'default_value' }}
        steps:
            - name: Echo Vars
              run: |
                  echo "Deploying to environment: ${{ env.MY_ENV_VALUE }}"
