name: 09 - Using Functions

on:
    pull_request:
    workflow_dispatch:

jobs:
    echo1:
        runs-on: ubuntu-latest
        steps:
            - name: Sleep for 20 seconds
              run: |
                  sleep 20
            - name: Print PR Title
              run: |
                  echo "PR Title: ${{ github.event.pull_request.title }}"
            - name: Print PR Labels
              run: |
                  cat  << EOF
                    PR Labels: ${{ toJson(github.event.pull_request.labels) }}
                  EOF
            - name: BUG
              if: ${{ !cancelled() && contains(github.event.pull_request.title, 'fix')}}
              run: echo "I am a bug fix"
            - name: Failing Step
              run: |
                  exit 1
            - name: I will be skipped
              if: ${{ success() }}
              run: |
                  echo "I will print if previous step succeeds"
            - name: I will execute
              if: ${{ failure() }}
              run: |
                  echo "I will print even if previous step fails"
            - name: I will execute
              if: ${{ !cancelled() }}
              run: echo "I will always print, except when the workflow is cancelled."
            - name: I will execute when cancelled
              if: ${{ cancelled() }}
              run: echo "I will print when the workflow has been cancelled."
